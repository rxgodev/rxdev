name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-audit --no-fund
      - name: Lint
        run: npx @biomejs/biome@2.5.8 check .githooks/ bin/ tests/
      - name: Syntax check
        run: |
          node --check bin/rxdev.js
          node --check .githooks/rxdev.mjs
      - name: Hook unit tests
        run: node --test tests/test_rxdev.mjs
      - name: CLI tests
        run: node --test tests/test_cli.mjs
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npx c8 --reporter=lcov node --test tests/test_rxdev.mjs
      - name: CLI smoke test
        run: |
          node bin/rxdev.js version
          node bin/rxdev.js --help
