name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check bin/ac.js
          node --check .githooks/ai_commit.mjs
      - name: Hook unit tests
        run: node --test tests/test_ai_commit.mjs
      - name: CLI smoke test
        run: |
          node bin/ac.js version
          node bin/ac.js --help >/dev/null
