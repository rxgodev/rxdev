name: RXDev AI Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install RXDev
        run: npm install -g rxdev

      - name: Run AI Review
        id: review
        run: |
          REVIEW=$(rxdev review --json 2>/dev/null || echo '{"error":"Review failed"}')
          echo "review=$REVIEW" >> $GITHUB_OUTPUT
        env:
          RXDEV_API_KEY: ${{ secrets.RXDEV_API_KEY }}

      - name: Post Review Comment
        if: steps.review.outputs.review != ''
        uses: actions/github-script@v7
        with:
          script: |
            const review = JSON.parse(`${{ steps.review.outputs.review }}`);
            if (review.error) {
              console.log('Review error:', review.error);
              return;
            }
            const body = review.review || 'No review generated';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 RXDev AI Review\n\n${body}`
            });
